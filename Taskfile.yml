version: '3'

vars:
  UUID: panelblaster@dasjott.de
  SCHEMA: schemas/org.gnome.shell.extensions.panelblaster.gschema.xml
  BUNDLE: '{{.UUID}}.shell-extension.zip'
  VENV: .venv

tasks:
  pack:
    desc: Build the GNOME Shell extension bundle ({{.UUID}}.shell-extension.zip)
    cmds:
      # Compile the schema so the extension can also be run from the source tree;
      # the packed bundle only ships the .xml, which GNOME compiles on install.
      - glib-compile-schemas schemas/
      # gnome-extensions pack only auto-includes metadata.json, extension.js,
      # prefs.js and stylesheet.css; every other module and asset must be listed.
      - |
        extra=""
        for f in *.js channels.json; do
          case "$f" in
            extension.js|prefs.js) continue ;;
          esac
          extra="$extra --extra-source=$f"
        done
        gnome-extensions pack --force \
          --podir=po \
          --schema="{{.SCHEMA}}" \
          --extra-source=images \
          $extra \
          .

  lint:
    desc: Validate the packed bundle with shexli, catching review issues early
    deps: [pack, _shexli-venv]
    cmds:
      - '{{.VENV}}/bin/shexli {{.BUNDLE}}'

  _shexli-venv:
    internal: true
    desc: Provision a local virtualenv with shexli (the EGO upload linter)
    cmds:
      - python3 -m venv {{.VENV}}
      # Pin tree-sitter <0.26: shexli's 0.25 JS grammar ABI-crashes on core 0.26.
      - '{{.VENV}}/bin/pip install -U -q shexli "tree-sitter<0.26"'
    # Skip reprovisioning once shexli is already installed in the venv.
    status:
      - test -x {{.VENV}}/bin/shexli
